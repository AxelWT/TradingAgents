name: Deploy

on:
  push:
    branches: [dev-frontend]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push to ACR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile.prod
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/tradingagents:latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/tradingagents:${{ steps.meta.outputs.tag }}

  deploy:
    name: Deploy to ECS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble .env from secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_CN_API_KEY: ${{ secrets.DASHSCOPE_CN_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_CN_API_KEY: ${{ secrets.ZHIPU_CN_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_CN_API_KEY: ${{ secrets.MINIMAX_CN_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TUSHARE_API_KEY: ${{ secrets.TUSHARE_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ACCESS_MODE: ${{ vars.ACCESS_MODE }}
        run: |
          cat > .env <<EOF
          # LLM Providers
          OPENAI_API_KEY=$OPENAI_API_KEY
          GOOGLE_API_KEY=$GOOGLE_API_KEY
          ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
          XAI_API_KEY=$XAI_API_KEY
          DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY
          DASHSCOPE_API_KEY=$DASHSCOPE_API_KEY
          DASHSCOPE_CN_API_KEY=$DASHSCOPE_CN_API_KEY
          ZHIPU_API_KEY=$ZHIPU_API_KEY
          ZHIPU_CN_API_KEY=$ZHIPU_CN_API_KEY
          MINIMAX_API_KEY=$MINIMAX_API_KEY
          MINIMAX_CN_API_KEY=$MINIMAX_CN_API_KEY
          OPENROUTER_API_KEY=$OPENROUTER_API_KEY
          MISTRAL_API_KEY=$MISTRAL_API_KEY
          MOONSHOT_API_KEY=$MOONSHOT_API_KEY
          GROQ_API_KEY=$GROQ_API_KEY
          NVIDIA_API_KEY=$NVIDIA_API_KEY
          OPENAI_COMPATIBLE_API_KEY=$OPENAI_COMPATIBLE_API_KEY
          # Data sources
          FRED_API_KEY=$FRED_API_KEY
          TUSHARE_API_KEY=$TUSHARE_API_KEY
          ALPHA_VANTAGE_API_KEY=$ALPHA_VANTAGE_API_KEY
          # Web backend
          JWT_SECRET_KEY=$JWT_SECRET_KEY
          CORS_ORIGINS=$CORS_ORIGINS
          DATABASE_URL=sqlite:////home/appuser/.tradingagents/web.db
          # Email verification (SMTP)
          SMTP_HOST=$SMTP_HOST
          SMTP_PORT=$SMTP_PORT
          SMTP_USE_SSL=$SMTP_USE_SSL
          SMTP_USERNAME=$SMTP_USERNAME
          SMTP_PASSWORD=$SMTP_PASSWORD
          SMTP_FROM_EMAIL=$SMTP_FROM_EMAIL
          # Admin & access control
          ADMIN_EMAIL=$ADMIN_EMAIL
          ADMIN_PASSWORD=$ADMIN_PASSWORD
          ACCESS_MODE=$ACCESS_MODE
          EOF

      - name: Base64 encode .env for transfer
        id: env_file
        run: echo "b64=$(base64 -w 0 .env)" >> $GITHUB_OUTPUT

      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: web/docker-compose.prod.yml
          target: ${{ secrets.DEPLOY_PATH || '/app/tradingagents' }}
          strip_components: 1
          overwrite: true

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ENV_FILE_B64: ${{ steps.env_file.outputs.b64 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: ACR_REGISTRY,ACR_NAMESPACE,ACR_USERNAME,ACR_PASSWORD,ENV_FILE_B64
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH || '/app/tradingagents' }}
            echo "$ENV_FILE_B64" | base64 -d > .env
            docker login -u $ACR_USERNAME -p $ACR_PASSWORD $ACR_REGISTRY
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
