services:
  tradingagents:
    build: .
    env_file:
      - .env
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  backend:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    env_file:
      - .env
      - ./web/backend/.env
    environment:
      - DATABASE_URL=sqlite:///./tradingagents_web.db
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
      - backend_data:/app/web/backend
    ports:
      - "8000:8000"

  frontend:
    build: ./web/frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
  backend_data:
